global:
  scrape_interval: 5s
scrape_configs:
  - job_name: iot-apis
    static_configs:
      - targets: ['registry:8001', 'ingestion:8002', 'data-api:8003']
  - job_name: iot-workers
    static_configs:
      - targets: ['outbox:9100', 'storage-writer:9100', 'rules-worker:9100', 'mqtt-bridge:9100']
  - job_name: identity
    static_configs:
      - targets: ['keycloak:9000']
