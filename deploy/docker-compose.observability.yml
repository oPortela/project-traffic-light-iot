services:
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ['obs']
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=15d']
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9090:9090']
  grafana:
    image: grafana/grafana:12.2.1
    profiles: ['obs']
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-password
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./secrets/grafana-password:/run/secrets/grafana-password:ro
      - ./observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ['127.0.0.1:3000:3000']
volumes:
  prometheus-data:
  grafana-data:
