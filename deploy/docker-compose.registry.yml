# Overlay: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.registry.yml --profile registry up ...
services:
  registry:
    profiles: ["registry"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.registry
    ports: ["127.0.0.1:8001:8001"]
    environment:
      PGHOST: postgres
      PGDATABASE: iot
      PGUSER: iot
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      REGISTRY_ADMINS_FILE: /run/secrets/registry-admins.json
    volumes:
      - ./secrets/registry-admins.json:/run/secrets/registry-admins.json:ro
      - ./secrets/registry-broker:/mosquitto-export
      - ./secrets/registry-broker:/mosquitto-export
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  registry-mosquitto:
    profiles: ["registry-mqtt"]
    image: eclipse-mosquitto:2.0
    command: ["mosquitto", "-c", "/mosquitto/registry/active.conf"]
    ports: ["127.0.0.1:1884:1883"]
    volumes:
      - ./secrets/registry-broker:/mosquitto/registry:ro
      - registry-mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  registry-mqtt-data:
