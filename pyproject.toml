[tool.pytest.ini_options]
pythonpath = ["projects/traffic-light", "."]
testpaths = ["projects/traffic-light/tests", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["app.controller", "app.integration", "iot_shared"]

[tool.coverage.report]
fail_under = 70
show_missing = true
