openapi: 3.1.0
info:
  title: Plataforma IoT — Ingestão
  version: 1.0.0
paths:
  /api/v1/ingestao:
    post:
      summary: Receive
      operationId: receive_api_v1_ingestao_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Message
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/ingestao/lote:
    post:
      summary: Batch
      operationId: batch_api_v1_ingestao_lote_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Batch'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    Batch:
      properties:
        mensagens:
          items: {}
          type: array
          maxItems: 5000
          minItems: 1
          title: Mensagens
      type: object
      required:
      - mensagens
      title: Batch
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
